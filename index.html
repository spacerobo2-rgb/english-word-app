<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>英単語暗記</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background: #f4f6fa;
    color: #222;
}

/* =========================
   ヘッダー
========================= */

header {
    background: white;
    padding: 18px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 6px 0 0;
    color: #777;
    font-size: 13px;
}


/* =========================
   全体
========================= */

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}


/* =========================
   カード
========================= */

.box {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.06);
}

.box h2 {
    font-size: 17px;
    margin-top: 0;
}


/* =========================
   ボタン
========================= */

button {
    border: none;
    border-radius: 10px;

    padding: 11px 15px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    background: #3478f6;
    color: white;
}

button:hover {
    opacity: 0.85;
}

button.gray {
    background: #e9edf3;
    color: #333;
}

button.red {
    background: #ffe5e5;
    color: #c62828;
}

button.active {
    background: #172033;
}


/* =========================
   ボタン横並び
========================= */

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}


/* =========================
   読み込み状態
========================= */

.status {
    margin-top: 10px;

    font-size: 13px;

    color: #666;

    min-height: 20px;
}


/* =========================
   単語カード
========================= */

.word-card {

    min-height: 300px;

    border: 2px solid #e3e7ee;

    border-radius: 18px;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    cursor: pointer;

    padding: 25px;

    user-select: none;
}

.question {

    font-size: 32px;

    font-weight: bold;

    line-height: 1.4;

    word-break: break-word;
}

.answer {

    margin-top: 20px;

    font-size: 27px;

    font-weight: bold;

    color: #3478f6;
}

.hint {

    margin-top: 25px;

    color: #888;

    font-size: 12px;
}


/* =========================
   モード
========================= */

.mode-buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-bottom: 10px;
}


/* =========================
   苦手表示
========================= */

.badge {

    display: inline-block;

    background: #fff1c7;

    color: #765700;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 12px;

    margin-left: 5px;
}


/* =========================
   単語一覧
========================= */

.word-list {

    max-height: 400px;

    overflow-y: auto;

    border-top: 1px solid #eee;
}

.word-row {

    display: grid;

    grid-template-columns:
        45px
        1fr
        1fr
        45px;

    gap: 8px;

    align-items: center;

    padding: 9px 0;

    border-bottom: 1px solid #eee;

    font-size: 14px;
}

.word-number {

    color: #888;

    font-size: 12px;
}


/* =========================
   非表示
========================= */

.hidden {
    display: none !important;
}


/* =========================
   注意書き
========================= */

.info {

    background: #eef6ff;

    border: 1px solid #cfe1ff;

    border-radius: 10px;

    padding: 11px;

    font-size: 13px;

    line-height: 1.6;
}

</style>

</head>


<body>


<header>

    <h1>📚 英単語暗記</h1>

    <p>
        CSVの単語データを読み込んで学習します
    </p>

</header>



<div class="container">


<!-- =========================
     データ読み込み
========================= -->

<section class="box">

    <h2>📂 単語データ</h2>

    <div class="info">

        このアプリは、同じフォルダにある
        <strong>words.csv</strong>
        を自動的に読み込みます。

    </div>

    <div
        id="status"
        class="status"
    >
        単語データを読み込んでいます…
    </div>

</section>



<!-- =========================
     暗記モード
========================= -->

<section
    id="studyBox"
    class="box hidden"
>

    <h2>🧠 暗記モード</h2>


    <!-- 日本語→英語 / 英語→日本語 -->

    <div class="mode-buttons">

        <button
            id="jpToEn"
            class="active"
        >
            日本語 → 英語
        </button>


        <button
            id="enToJp"
            class="gray"
        >
            英語 → 日本語
        </button>

    </div>


    <!-- 出題範囲 -->

    <div class="buttons">

        <button
            id="allMode"
            class="gray"
        >
            全部から出題
        </button>


        <button
            id="weakMode"
            class="gray"
        >
            苦手だけ
        </button>


        <span
            id="count"
            class="badge"
        >
            0語
        </span>

    </div>


    <div style="height:12px"></div>


    <!-- 単語カード -->

    <div
        id="wordCard"
        class="word-card"
    >

        <div>

            <div
                id="question"
                class="question"
            >
                準備中…
            </div>


            <div
                id="answer"
                class="answer hidden"
            >
            </div>


            <div class="hint">

                タップすると答えが表示されます<br>

                もう一度タップすると次の問題です

            </div>

        </div>

    </div>


    <div style="height:10px"></div>


    <!-- カード操作 -->

    <div class="buttons">

        <button
            id="weakButton"
            class="gray"
        >
            ☆ 苦手にする
        </button>


        <button
            id="speakButton"
            class="gray"
        >
            🔊 英語を読む
        </button>

    </div>

</section>



<!-- =========================
     単語一覧
========================= -->

<section
    id="listBox"
    class="box hidden"
>

    <h2>
        📖 単語一覧
    </h2>


    <div
        id="wordList"
        class="word-list"
    >
    </div>

</section>



</div>



<script>

/* =========================================================
   基本設定
========================================================= */

const CSV_FILE = "words.csv";

const STORAGE_KEY =
    "english_word_weak_words_v1";


/* =========================================================
   データ
========================================================= */

let words = [];

let currentWord = null;

let showingAnswer = false;

let direction = "jp";

let questionMode = "all";


/* =========================================================
   HTML要素
========================================================= */

const statusElement =
    document.getElementById("status");

const studyBox =
    document.getElementById("studyBox");

const listBox =
    document.getElementById("listBox");

const wordCard =
    document.getElementById("wordCard");

const questionElement =
    document.getElementById("question");

const answerElement =
    document.getElementById("answer");

const countElement =
    document.getElementById("count");

const weakButton =
    document.getElementById("weakButton");


/* =========================================================
   CSVを読み込む
========================================================= */

async function loadCSV() {

    try {

        statusElement.textContent =
            "words.csvを読み込んでいます…";


        const response =
            await fetch(CSV_FILE);


        if (!response.ok) {

            throw new Error(
                "words.csvが見つかりません"
            );

        }


        const text =
            await response.text();


        words =
            parseCSV(text);


        if (words.length === 0) {

            throw new Error(
                "単語データがありません"
            );

        }


        /*
         * 苦手情報を読み込む
         */

        loadWeakWords();


        statusElement.textContent =
            `${words.length}語を読み込みました！`;


        studyBox
            .classList
            .remove("hidden");


        listBox
            .classList
            .remove("hidden");


        updateCount();

        showNextQuestion();

        renderWordList();


    } catch (error) {

        console.error(error);


        statusElement.innerHTML =

            "❌ 単語データを読み込めませんでした。<br>" +

            "GitHubに <strong>words.csv</strong> が入っているか確認してください。";

    }

}


/* =========================================================
   CSV解析
========================================================= */

function parseCSV(text) {

    /*
     * 改行コードを統一
     */

    text =
        text.replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n");


    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    /*
     * CSVを1文字ずつ解析
     *
     * カンマを含む文章にも対応
     */

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        if (char === '"') {

            if (
                insideQuotes &&
                text[i + 1] === '"'
            ) {

                cell += '"';

                i++;

            } else {

                insideQuotes =
                    !insideQuotes;

            }

        }

        else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(cell);

            cell = "";

        }

        else if (
            char === "\n" &&
            !insideQuotes
        ) {

            row.push(cell);

            rows.push(row);

            row = [];

            cell = "";

        }

        else {

            cell += char;

        }

    }


    /*
     * 最後の行
     */

    if (
        cell !== "" ||
        row.length > 0
    ) {

        row.push(cell);

        rows.push(row);

    }


    /*
     * 1行目は見出し
     */

    const dataRows =
        rows.slice(1);


    const result = [];


    for (
        let i = 0;
        i < dataRows.length;
        i++
    ) {

        const row =
            dataRows[i];


        if (
            row.length < 3
        ) {

            continue;

        }


        const number =
            row[0].trim();


        const jp =
            row[1].trim();


        const en =
            row[2].trim();


        if (
            !jp ||
            !en
        ) {

            continue;

        }


        result.push({

            id:
                number ||
                String(i + 1),

            number:
                number,

            jp:
                jp,

            en:
                en,

            weak:
                false

        });

    }


    return result;

}


/* =========================================================
   苦手データ保存
========================================================= */

function loadWeakWords() {

    try {

        const saved =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                ) || "[]"
            );


        words.forEach(word => {

            word.weak =
                saved.includes(
                    word.id
                );

        });

    }

    catch {

        console.log(
            "苦手データなし"
        );

    }

}


/* =========================================================
   苦手データ保存
========================================================= */

function saveWeakWords() {

    const weakIds =
        words
            .filter(word => word.weak)
            .map(word => word.id);


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            weakIds
        )
    );

}


/* =========================================================
   出題対象
========================================================= */

function getQuestionPool() {

    if (
        questionMode === "weak"
    ) {

        const weakWords =
            words.filter(
                word => word.weak
            );


        /*
         * 苦手が0個なら
         * 全部から出す
         */

        if (
            weakWords.length === 0
        ) {

            alert(
                "苦手に登録された単語がありません。"
            );


            questionMode = "all";

            return words;

        }


        return weakWords;

    }


    return words;

}


/* =========================================================
   次の問題
========================================================= */

function showNextQuestion() {

    const pool =
        getQuestionPool();


    if (
        pool.length === 0
    ) {

        questionElement.textContent =
            "単語がありません";

        return;

    }


    /*
     * ランダム
     */

    const index =
        Math.floor(
            Math.random() *
            pool.length
        );


    currentWord =
        pool[index];


    showingAnswer =
        false;


    answerElement
        .classList
        .add("hidden");


    /*
     * 日本語→英語
     */

    if (
        direction === "jp"
    ) {

        questionElement.textContent =
            currentWord.jp;

    }


    /*
     * 英語→日本語
     */

    else {

        questionElement.textContent =
            currentWord.en;


        /*
         * 英語を表示した瞬間に読み上げ
         */

        speakEnglish(
            currentWord.en
        );

    }


    updateWeakButton();

}


/* =========================================================
   答えを表示
========================================================= */

function showAnswer() {

    if (!currentWord) {
        return;
    }


    if (
        showingAnswer === false
    ) {

        showingAnswer = true;


        if (
            direction === "jp"
        ) {

            answerElement.textContent =
                currentWord.en;


            speakEnglish(
                currentWord.en
            );

        }

        else {

            answerElement.textContent =
                currentWord.jp;

        }


        answerElement
            .classList
            .remove("hidden");

    }

    else {

        showNextQuestion();

    }

}


/* =========================================================
   カードタップ
========================================================= */

wordCard.onclick =
    showAnswer;


/* =========================================================
   日本語→英語
========================================================= */

document
    .getElementById("jpToEn")
    .onclick = function() {

        direction = "jp";


        this.classList
            .add("active");

        this.classList
            .remove("gray");


        const other =
            document
                .getElementById(
                    "enToJp"
                );


        other.classList
            .remove("active");

        other.classList
            .add("gray");


        showNextQuestion();

    };


/* =========================================================
   英語→日本語
========================================================= */

document
    .getElementById("enToJp")
    .onclick = function() {

        direction = "en";


        this.classList
            .add("active");

        this.classList
            .remove("gray");


        const other =
            document
                .getElementById(
                    "jpToEn"
                );


        other.classList
            .remove("active");

        other.classList
            .add("gray");


        showNextQuestion();

    };


/* =========================================================
   全部から出題
========================================================= */

document
    .getElementById("allMode")
    .onclick = function() {

        questionMode = "all";

        this.classList
            .add("active");


        document
            .getElementById(
                "weakMode"
            )
            .classList
            .remove("active");


        showNextQuestion();

    };


/* =========================================================
   苦手だけ
========================================================= */

document
    .getElementById("weakMode")
    .onclick = function() {

        questionMode = "weak";

        this.classList
            .add("active");


        document
            .getElementById(
                "allMode"
            )
            .classList
            .remove("active");


        showNextQuestion();

    };


/* =========================================================
   苦手ボタン
========================================================= */

weakButton.onclick =
    function(event) {

        event.stopPropagation();


        if (!currentWord) {
            return;
        }


        currentWord.weak =
            !currentWord.weak;


        saveWeakWords();

        updateWeakButton();

        updateCount();

        renderWordList();

    };


/* =========================================================
   苦手ボタン表示
========================================================= */

function updateWeakButton() {

    if (!currentWord) {
        return;
    }


    if (
        currentWord.weak
    ) {

        weakButton.textContent =
            "★ 苦手を外す";

    }

    else {

        weakButton.textContent =
            "☆ 苦手にする";

    }

}


/* =========================================================
   カウント表示
========================================================= */

function updateCount() {

    const weakCount =
        words.filter(
            word => word.weak
        ).length;


    countElement.textContent =
        `全${words.length}語・苦手${weakCount}語`;

}


/* =========================================================
   英語読み上げ
========================================================= */

function speakEnglish(text) {

    if (!text) {
        return;
    }


    /*
     * 前の読み上げを停止
     */

    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "en-US";


    utterance.rate =
        0.82;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   読み上げボタン
========================================================= */

document
    .getElementById("speakButton")
    .onclick = function(event) {

        event.stopPropagation();


        if (currentWord) {

            speakEnglish(
                currentWord.en
            );

        }

    };


/* =========================================================
   単語一覧
========================================================= */

function renderWordList() {

    const list =
        document.getElementById(
            "wordList"
        );


    list.innerHTML = "";


    words.forEach(word => {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "word-row";


        row.innerHTML = `

            <div class="word-number">
                ${escapeHTML(word.number)}
            </div>

            <div>
                ${escapeHTML(word.jp)}
            </div>

            <div>
                ${escapeHTML(word.en)}
            </div>

            <div>
                ${word.weak ? "⭐" : ""}
            </div>

        `;


        list.appendChild(row);

    });

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   アプリ起動
========================================================= */

loadCSV();

</script>

</body>
</html>
