<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>英単語カメラ暗記</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Sans","Yu Gothic",sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#fff;
  padding:18px 16px 12px;
  border-bottom:1px solid #e4e8ef;
  position:sticky;
  top:0;
  z-index:5;
}

h1{
  font-size:21px;
  margin:0 0 5px;
}

.sub{
  font-size:12px;
  color:#6b7280;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px #0000000b;
}

h2{
  font-size:17px;
  margin:0 0 12px;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  background:#315efb;
  color:#fff;
  font-weight:700;
}

button.secondary{
  background:#eef2f7;
  color:#253047;
}

button.danger{
  background:#fff0f0;
  color:#b42318;
}

button:disabled{
  opacity:.5;
}

input[type=file]{
  width:100%;
  padding:12px;
  background:#f3f5f8;
  border-radius:10px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.progress{
  height:10px;
  background:#e9edf3;
  border-radius:99px;
  overflow:hidden;
  margin:10px 0;
}

.bar{
  height:100%;
  width:0;
  background:#315efb;
  transition:.2s;
}

.status{
  font-size:13px;
  color:#526070;
  min-height:20px;
}

.preview{
  width:100%;
  max-height:420px;
  object-fit:contain;
  background:#111;
  border-radius:12px;
  display:block;
}

.controls label{
  display:grid;
  grid-template-columns:65px 1fr 50px;
  gap:8px;
  align-items:center;
  margin:8px 0;
  font-size:13px;
}

input[type=range]{
  width:100%;
}

.small{
  font-size:12px;
  color:#697386;
  line-height:1.55;
}

.mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.mode button.active{
  background:#172033;
}

.flash{
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:2px solid #e3e8f0;
  border-radius:18px;
  padding:22px;
  cursor:pointer;
  user-select:none;
}

.flash .q{
  font-size:30px;
  font-weight:800;
  line-height:1.35;
  word-break:break-word;
}

.flash .a{
  font-size:25px;
  margin-top:20px;
  color:#315efb;
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:99px;
  background:#fff2cc;
  color:#7a5700;
  font-size:12px;
}

.wordlist{
  max-height:420px;
  overflow:auto;
}

.word{
  display:grid;
  grid-template-columns:42px 1fr 1fr 50px;
  gap:7px;
  align-items:center;
  border-bottom:1px solid #edf0f4;
  padding:8px 0;
  font-size:14px;
}

.word input{
  width:100%;
  border:1px solid #d9dee8;
  border-radius:7px;
  padding:6px;
}

.word .num{
  color:#7b8494;
  font-size:12px;
}

.word button{
  padding:6px 8px;
  font-size:12px;
  background:#eef2f7;
  color:#253047;
}

.hidden{
  display:none!important;
}

.notice{
  background:#eef6ff;
  border:1px solid #cfe1ff;
  border-radius:12px;
  padding:11px;
  font-size:13px;
  line-height:1.55;
}
</style>
</head>

<body>

<header>
  <h1>📷 英単語カメラ暗記</h1>
  <div class="sub">
    写真の表を読み取り、英単語カードにします
  </div>
</header>

<main>

<!-- 写真読み込み -->
<section class="card">

  <h2>① 写真を読み込む</h2>

  <input
    id="photo"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <div style="height:10px"></div>

  <img
    id="preview"
    class="preview hidden"
  >

  <div id="cropBox" class="controls hidden">

    <div
      class="small"
      style="margin-top:10px"
    >
      表の上下を調整できます。
      写真が表だけなら、基本はそのままでOK。
    </div>

    <label>
      上
      <input
        id="top"
        type="range"
        min="0"
        max="40"
        value="14"
      >
      <span id="topv">14%</span>
    </label>

    <label>
      下
      <input
        id="bottom"
        type="range"
        min="60"
        max="100"
        value="87"
      >
      <span id="bottomv">87%</span>
    </label>

    <label>
      左
      <input
        id="left"
        type="range"
        min="0"
        max="20"
        value="0"
      >
      <span id="leftv">0%</span>
    </label>

    <label>
      右
      <input
        id="right"
        type="range"
        min="80"
        max="100"
        value="100"
      >
      <span id="rightv">100%</span>
    </label>

    <div class="small">
      このアプリは「3つの表が横に並ぶタイプ」を想定して、
      各表を日本語欄・英語欄に分けてOCRします。
    </div>

  </div>

  <div class="row" style="margin-top:10px">

    <button id="ocrBtn" disabled>
      🔍 高精度で読み取る
    </button>

    <button
      id="resetCrop"
      class="secondary hidden"
    >
      範囲を初期値に戻す
    </button>

  </div>

  <div class="progress">
    <div
      id="bar"
      class="bar"
    ></div>
  </div>

  <div
    id="status"
    class="status"
  ></div>

</section>


<!-- OCR結果編集 -->
<section
  id="editSection"
  class="card hidden"
>

  <h2>② 読み取り結果を確認</h2>

  <div class="notice">
    OCRは完璧ではないので、間違っている単語だけ直してください。
    保存すると次回から写真なしで使えます。
  </div>

  <div
    id="wordList"
    class="wordlist"
    style="margin-top:10px"
  ></div>

  <div
    class="row"
    style="margin-top:12px"
  >

    <button id="saveBtn">
      💾 保存して暗記を始める
    </button>

    <button
      id="retryBtn"
      class="secondary"
    >
      📷 もう一度読み取る
    </button>

  </div>

</section>


<!-- 暗記 -->
<section
  id="studySection"
  class="card hidden"
>

  <h2>③ 暗記</h2>

  <div class="mode">

    <button
      id="jpMode"
      class="active"
    >
      日本語 → 英語
    </button>

    <button
      id="enMode"
      class="secondary"
    >
      英語 → 日本語
    </button>

  </div>

  <div
    class="row"
    style="margin:12px 0"
  >

    <button
      id="allBtn"
      class="secondary"
    >
      全部から出題
    </button>

    <button
      id="weakBtn"
      class="secondary"
    >
      苦手だけ
    </button>

    <span
      id="countBadge"
      class="badge"
    ></span>

  </div>

  <div
    id="flash"
    class="flash"
  >

    <div>

      <div
        class="q"
        id="question"
      >
        準備OK
      </div>

      <div
        id="answer"
        class="a hidden"
      ></div>

      <div
        class="small"
        style="margin-top:22px"
      >
        タップで答え
        → もう一度タップで次へ
      </div>

    </div>

  </div>

  <div
    class="row"
    style="margin-top:10px"
  >

    <button
      id="weakToggle"
      class="secondary"
    >
      ☆ 苦手にする
    </button>

    <button
      id="speakBtn"
      class="secondary"
    >
      🔊 英語を読む
    </button>

  </div>

</section>


<!-- 保存単語一覧 -->
<section
  id="listSection"
  class="card hidden"
>

  <h2>単語一覧</h2>

  <div class="row">

    <button
      id="clearBtn"
      class="danger"
    >
      全部削除
    </button>

  </div>

  <div
    id="savedList"
    class="wordlist"
    style="margin-top:10px"
  ></div>

</section>

</main>


<script>

const $ = id => document.getElementById(id);

let imageFile = null;

let pairs = [];

let current = null;

let revealed = false;

let direction = "jp";

let poolMode = "all";

const savedKey = "englishWordPairsV3";



/* =========================
   範囲表示
========================= */

function updateCropLabels(){

  ["top","bottom","left","right"].forEach(k=>{

    $(k+"v").textContent =
      $(k).value + "%";

  });

}


["top","bottom","left","right"]
.forEach(k=>{

  $(k).addEventListener(
    "input",
    updateCropLabels
  );

});


updateCropLabels();



/* =========================
   写真選択
========================= */

$("photo").addEventListener(
  "change",
  e=>{

    const f = e.target.files?.[0];

    if(!f) return;

    imageFile = f;

    $("preview").src =
      URL.createObjectURL(f);

    $("preview")
      .classList
      .remove("hidden");

    $("cropBox")
      .classList
      .remove("hidden");

    $("resetCrop")
      .classList
      .remove("hidden");

    $("ocrBtn").disabled = false;

    $("status").textContent =
      "写真を読み込みました。表が画面いっぱいになるように撮ると、さらに精度が上がります。";

  }
);



/* =========================
   範囲リセット
========================= */

$("resetCrop").onclick = ()=>{

  $("top").value = 14;

  $("bottom").value = 87;

  $("left").value = 0;

  $("right").value = 100;

  updateCropLabels();

};



/* =========================
   画像読み込み
========================= */

function loadImage(file){

  return new Promise(
    (resolve,reject)=>{

      const im = new Image();

      im.onload = ()=>resolve(im);

      im.onerror = reject;

      im.src =
        URL.createObjectURL(file);

    }
  );

}



/* =========================
   OCR用画像加工
========================= */

function makeCropCanvas(
  img,
  x0,
  y0,
  x1,
  y1,
  scale=2.2
){

  const sx =
    Math.max(
      0,
      Math.floor(
        img.naturalWidth * x0
      )
    );

  const sy =
    Math.max(
      0,
      Math.floor(
        img.naturalHeight * y0
      )
    );

  const sw =
    Math.min(
      img.naturalWidth - sx,
      Math.floor(
        img.naturalWidth *
        (x1-x0)
      )
    );

  const sh =
    Math.min(
      img.naturalHeight - sy,
      Math.floor(
        img.naturalHeight *
        (y1-y0)
      )
    );


  const c =
    document.createElement(
      "canvas"
    );


  c.width =
    Math.max(
      1,
      Math.floor(sw * scale)
    );

  c.height =
    Math.max(
      1,
      Math.floor(sh * scale)
    );


  const ctx =
    c.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  ctx.imageSmoothingEnabled = true;

  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(
    img,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    c.width,
    c.height
  );


  /*
    グレースケール＋コントラスト補正
  */

  const d =
    ctx.getImageData(
      0,
      0,
      c.width,
      c.height
    );

  const a = d.data;


  for(
    let i=0;
    i<a.length;
    i+=4
  ){

    const g =
      0.299*a[i] +
      0.587*a[i+1] +
      0.114*a[i+2];


    let v =
      (g-128)*1.32+128;


    v =
      Math.max(
        0,
        Math.min(
          255,
          v
        )
      );


    a[i] =
      v;

    a[i+1] =
      v;

    a[i+2] =
      v;

  }


  ctx.putImageData(
    d,
    0,
    0
  );


  return c;

}



/* =========================
   日本語クリーニング
========================= */

function cleanJp(s){

  s =
    (s||"")
    .replace(
      /[|_]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  s =
    s.replace(
      /^[^0-9０-９]*
      ([0-9０-９]{1,3})\s*/,
      "$1 "
    );


  s =
    s.replace(
      /^[\s\[\](){}.,:;]+|
      [\s\[\](){}.,:;]+$/g,
      ""
    );


  return s;

}



/* =========================
   英語クリーニング
========================= */

function cleanEn(s){

  s =
    (s||"")
    .replace(
      /[^A-Za-z'’\-\s]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  const words =
    s.split(/\s+/)
    .filter(Boolean);


  return words
    .slice(0,5)
    .join(" ");

}



/* =========================
   OCR行取得
========================= */

function getLines(data){

  if(
    data?.lines?.length
  ){

    return data.lines

      .map(
        l=>({

          text:
            (l.text||"").trim(),

          y:
            (l.bbox?.y0||0)

        })
      )

      .filter(
        x=>x.text
      )

      .sort(
        (a,b)=>a.y-b.y
      );

  }


  return (data?.text||"")
    .split(/\n/)
    .map(
      (text,i)=>({
        text:text.trim(),
        y:i
      })
    )
    .filter(
      x=>x.text
    );

}



/* =========================
   日本語行 → 単語
========================= */

function rowsFromJp(lines){

  const out = [];


  for(
    const l of lines
  ){

    const t =
      cleanJp(l.text);


    const m =
      t.match(
        /^(\d{1,3})\s+(.+)/
      );


    if(m){

      const n =
        Number(m[1]);


      if(
        n>=1 &&
        n<=999
      ){

        out.push({

          n,

          jp:
            m[2].trim(),

          y:l.y

        });

      }

    }

  }


  return out;

}



/* =========================
   英語行
========================= */

function rowsFromEn(lines){

  const out = [];


  for(
    const l of lines
  ){

    const t =
      cleanEn(l.text);


    if(!t)
      continue;


    const alpha =
      (
        t.match(
          /[A-Za-z]/g
        )||[]
      ).length;


    if(alpha>=2){

      out.push({

        en:t,

        y:l.y

      });

    }

  }


  return out;

}



/* =========================
   日本語と英語を行で対応
========================= */

function nearestEnglish(
  jp,
  enLines,
  used
){

  let best = null;

  let bd = 1e9;


  for(
    let i=0;
    i<enLines.length;
    i++
  ){

    if(
      used.has(i)
    )
      continue;


    const d =
      Math.abs(
        jp.y -
        enLines[i].y
      );


    if(d<bd){

      bd=d;

      best=i;

    }

  }


  if(
    best!==null
  ){

    used.add(best);

    return enLines[best].en;

  }


  return "";

}



/* =========================
   OCR Worker
========================= */

async function makeWorker(
  lang,
  label
){

  return await Tesseract.createWorker(
    lang,
    1,
    {

      workerPath:
        "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",

      langPath:
        "https://tessdata.projectnaptha.com/4.0.0",

      corePath:
        "https://cdn.jsdelivr.net/npm/tesseract.js-core@5",

      logger:m=>{

        if(
          m.status &&
          typeof m.progress ===
          "number"
        ){

          $("status").textContent =
            label +
            "：" +
            m.status +
            " " +
            Math.round(
              m.progress*100
            ) +
            "%";

        }

      }

    }
  );

}



/* =========================
   OCR実行
========================= */

async function runOCR(){

  if(!imageFile)
    return;


  $("ocrBtn").disabled = true;

  $("bar").style.width =
    "2%";


  $("status").textContent =
    "写真を補正しています…";


  try{

    const img =
      await loadImage(
        imageFile
      );


    const top =
      Number(
        $("top").value
      ) / 100;


    const bottom =
      Number(
        $("bottom").value
      ) / 100;


    const left =
      Number(
        $("left").value
      ) / 100;


    const right =
      Number(
        $("right").value
      ) / 100;


    /*
      写真を3列に分割
    */

    const totalW =
      right-left;


    const colW =
      totalW/3;


    /*
      日本語OCR
    */

    const jpWorker =
      await makeWorker(
        "jpn",
        "日本語OCR"
      );


    /*
      英語OCR
    */

    const enWorker =
      await makeWorker(
        "eng",
        "英語OCR"
      );


    const result = [];


    for(
      let col=0;
      col<3;
      col++
    ){

      const cx =
        left +
        colW*col;


      /*
        日本語側
      */

      const jpC =
        makeCropCanvas(
          img,
          cx,
          top,
          cx+colW*0.54,
          bottom,
          2.2
        );


      /*
        英語側
      */

      const enC =
        makeCropCanvas(
          img,
          cx+colW*0.50,
          top,
          cx+colW,
          bottom,
          2.2
        );


      $("status").textContent =
        `${col+1}/3列目を読み取り中…`;


      /*
        日本語OCR
      */

      const jr =
        await jpWorker.recognize(
          jpC,
          {
            rotateAuto:true
          }
        );


      $("bar").style.width =
        (15+col*25)+"%";


      /*
        英語OCR
      */

      const er =
        await enWorker.recognize(
          enC,
          {
            rotateAuto:true
          }
        );


      $("bar").style.width =
        (35+col*25)+"%";


      const jrows =
        rowsFromJp(
          getLines(
            jr.data
          )
        );


      const erows =
        rowsFromEn(
          getLines(
            er.data
          )
        );


      const used =
        new Set();


      /*
        同じ高さの日本語と英語を
        同じ単語としてペアにする
      */

      for(
        const j of jrows
      ){

        const en =
          nearestEnglish(
            j,
            erows,
            used
          );


        if(
          j.jp &&
          en
        ){

          result.push({

            n:j.n,

            jp:j.jp,

            en:en,

            weak:false

          });

        }

      }

    }


    await jpWorker.terminate();

    await enWorker.terminate();


    /*
      OCRの重複を削除
    */

    const seen =
      new Set();


    pairs =
      result

      .filter(x=>{

        const key =
          x.n +
          "|" +
          x.en.toLowerCase();


        if(
          seen.has(key)
        )
          return false;


        seen.add(key);

        return true;

      })

      .sort(
        (a,b)=>
          a.n-b.n
      );


    if(
      pairs.length < 3
    ){

      throw new Error(
        "単語を十分に読み取れませんでした。表の範囲を調整してもう一度試してください。"
      );

    }


    /*
      編集画面表示
    */

    renderEditor(
      pairs
    );


    $("bar").style.width =
      "100%";


    $("status").textContent =
      `完了！ ${pairs.length}語を読み取りました。`;

  }
  catch(e){

    console.error(e);


    $("status").textContent =
      "読み取りに失敗しました：" +
      (e.message||e);


    alert(
      "OCRに失敗しました。表の上下を調整して、もう一度試してください。"
    );

  }
  finally{

    $("ocrBtn").disabled =
      false;

  }

}



$("ocrBtn").onclick =
  runOCR;



/* =========================
   OCR結果編集
========================= */

function renderEditor(list){

  pairs=list;


  $("editSection")
    .classList
    .remove("hidden");


  $("wordList").innerHTML="";


  for(
    const [i,w]
    of pairs.entries()
  ){

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "word";


    div.innerHTML = `

      <div class="num">
        ${w.n||i+1}
      </div>

      <input
        data-i="${i}"
        data-k="jp"
        value="${esc(w.jp)}"
      >

      <input
        data-i="${i}"
        data-k="en"
        value="${esc(w.en)}"
      >

      <button
        data-i="${i}"
        class="speakOne"
      >
        🔊
      </button>

    `;


    $("wordList")
      .appendChild(div);

  }


  /*
    編集欄
  */

  $("wordList")
    .querySelectorAll("input")
    .forEach(
      inp=>{

        inp.addEventListener(
          "input",
          e=>{

            pairs[
              Number(
                e.target.dataset.i
              )
            ][
              e.target.dataset.k
            ] =
              e.target.value;

          }
        );

      }
    );


  /*
    読み上げ
  */

  $("wordList")
    .querySelectorAll(
      ".speakOne"
    )
    .forEach(
      b=>{

        b.onclick=()=>{

          const w =
            pairs[
              Number(
                b.dataset.i
              )
            ];


          speak(
            w.en
          );

        };

      }
    );

}



/* =========================
   HTMLエスケープ
========================= */

function esc(s){

  return String(
    s||""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    /"/g,
    "&quot;"
  );

}



/* =========================
   保存
========================= */

$("saveBtn").onclick = ()=>{

  localStorage.setItem(
    savedKey,
    JSON.stringify(
      pairs
    )
  );


  loadSaved();


  $("studySection")
    .classList
    .remove("hidden");


  $("listSection")
    .classList
    .remove("hidden");


  startNext();


  window.scrollTo({

    top:
      $("studySection")
      .offsetTop-70,

    behavior:"smooth"

  });

};



/* =========================
   再撮影
========================= */

$("retryBtn").onclick = ()=>{

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

};



/* =========================
   保存データ読み込み
========================= */

function loadSaved(){

  try{

    pairs =
      JSON.parse(
        localStorage.getItem(
          savedKey
        )||"[]"
      );

  }
  catch{

    pairs=[];

  }


  if(
    !pairs.length
  )
    return;


  $("studySection")
    .classList
    .remove("hidden");


  $("listSection")
    .classList
    .remove("hidden");


  renderSavedList();

  updateBadge();

}



/* =========================
   保存単語一覧
========================= */

function renderSavedList(){

  $("savedList")
    .innerHTML="";


  pairs.forEach(
    (w,i)=>{

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "word";


      div.innerHTML = `

        <div class="num">
          ${w.n||i+1}
        </div>

        <div>
          ${esc(w.jp)}
        </div>

        <div>
          ${esc(w.en)}
        </div>

        <button
          data-i="${i}"
          class="speakOne"
        >
          🔊
        </button>

      `;


      $("savedList")
        .appendChild(div);

    }
  );


  $("savedList")
    .querySelectorAll(
      ".speakOne"
    )
    .forEach(
      b=>{

        b.onclick=()=>{

          speak(
            pairs[
              Number(
                b.dataset.i
              )
            ].en
          );

        };

      }
    );

}



/* =========================
   英語読み上げ
========================= */

function speak(text){

  if(!text)
    return;


  speechSynthesis.cancel();


  const u =
    new SpeechSynthesisUtterance(
      text
    );


  u.lang =
    "en-US";


  u.rate =
    .82;


  speechSynthesis.speak(u);

}



/* =========================
   苦手数表示
========================= */

function updateBadge(){

  const weak =
    pairs.filter(
      x=>x.weak
    ).length;


  $("countBadge").textContent =
    `全${pairs.length}語・苦手${weak}語`;

}



/* =========================
   出題プール
========================= */

function choosePool(){

  let p =
    poolMode==="weak"
      ? pairs.filter(
          x=>x.weak
        )
      : pairs.slice();


  if(
    !p.length
  ){

    poolMode="all";

    p=pairs.slice();


    alert(
      "苦手登録された単語がありません。全部から出題します。"
    );

  }


  return p;

}



/* =========================
   次の問題
========================= */

function startNext(){

  const p =
    choosePool();


  if(
    !p.length
  )
    return;


  current =
    p[
      Math.floor(
        Math.random()*
        p.length
      )
    ];


  revealed=false;


  $("answer")
    .classList
    .add("hidden");


  $("answer").textContent =
    direction==="jp"
      ? current.en
      : current.jp;


  $("question").textContent =
    direction==="jp"
      ? current.jp
      : current.en;


  /*
    英語→日本語では
    問題を出した瞬間に英語を読む
  */

  if(
    direction==="en"
  ){

    speak(
      current.en
    );

  }


  $("weakToggle").textContent =
    current.weak
      ? "★ 苦手を外す"
      : "☆ 苦手にする";


  updateBadge();

}



/* =========================
   カードタップ
========================= */

$("flash").onclick = ()=>{

  if(!current)
    return;


  if(!revealed){

    revealed=true;


    $("answer")
      .classList
      .remove("hidden");


    /*
      日本語→英語なら
      答えを出したときに英語を読む
    */

    if(
      direction==="jp"
    ){

      speak(
        current.en
      );

    }

  }
  else{

    startNext();

  }

};



/* =========================
   日本語→英語
========================= */

$("jpMode").onclick = ()=>{

  direction="jp";


  $("jpMode")
    .classList
    .add("active");


  $("enMode")
    .classList
    .remove("active");


  startNext();

};



/* =========================
   英語→日本語
========================= */

$("enMode").onclick = ()=>{

  direction="en";


  $("enMode")
    .classList
    .add("active");


  $("jpMode")
    .classList
    .remove("active");


  startNext();

};



/* =========================
   全部から出題
========================= */

$("allBtn").onclick = ()=>{

  poolMode="all";

  startNext();

};



/* =========================
   苦手だけ
========================= */

$("weakBtn").onclick = ()=>{

  poolMode="weak";

  startNext();

};



/* =========================
   苦手登録
========================= */

$("weakToggle").onclick = ()=>{

  if(!current)
    return;


  current.weak =
    !current.weak;


  localStorage.setItem(
    savedKey,
    JSON.stringify(
      pairs
    )
  );


  $("weakToggle").textContent =
    current.weak
      ? "★ 苦手を外す"
      : "☆ 苦手にする";


  updateBadge();

  renderSavedList();

};



/* =========================
   英語を読む
========================= */

$("speakBtn").onclick = ()=>{

  if(current){

    speak(
      current.en
    );

  }

};



/* =========================
   全削除
========================= */

$("clearBtn").onclick = ()=>{

  if(
    confirm(
      "保存した単語を全部削除しますか？"
    )
  ){

    localStorage.removeItem(
      savedKey
    );


    pairs=[];


    $("studySection")
      .classList
      .add("hidden");


    $("listSection")
      .classList
      .add("hidden");


    $("editSection")
      .classList
      .add("hidden");

  }

};



/* =========================
   起動
========================= */

loadSaved();

</script>

</body>
</html>
