<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<title>英単語カメラ暗記</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:#f4f5f8;
  --card:#fff;
  --text:#1d1d1f;
  --muted:#707070;
  --line:#ddd;
  --accent:#111;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

header{
  background:#fff;
  padding:18px 16px 12px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

h1{
  font-size:22px;
  margin:0 0 3px;
}

.sub{
  font-size:12px;
  color:var(--muted);
}

main{
  max-width:720px;
  margin:auto;
  padding:14px;
}

.section{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 12px #0000000a;
}

h2{
  font-size:17px;
  margin:0 0 12px;
}

button,
.fileBtn{
  appearance:none;
  border:0;
  border-radius:14px;
  padding:13px 16px;
  font-size:16px;
  font-weight:700;
  background:#111;
  color:#fff;
  cursor:pointer;
  text-align:center;
}

button.secondary{
  background:#e9e9ee;
  color:#111;
}

button:disabled{
  opacity:.45;
}

.fileBtn{
  display:block;
  width:100%;
  font-size:17px;
}

input[type=file]{
  display:none;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

.card{
  min-height:280px;
  border-radius:22px;
  background:#fff;
  margin:14px 0;
  padding:30px 18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-shadow:0 4px 18px #00000012;
  cursor:pointer;
}

.label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:14px;
}

.prompt{
  font-size:32px;
  font-weight:800;
  word-break:break-word;
}

.answer{
  font-size:31px;
  font-weight:800;
  margin-top:18px;
  word-break:break-word;
}

.answer.jp{
  font-size:25px;
}

.hint{
  font-size:13px;
  color:var(--muted);
  margin-top:14px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
  min-width:130px;
}

.big{
  width:100%;
  padding:17px;
  font-size:18px;
}

.status{
  font-size:13px;
  color:#666;
  white-space:pre-wrap;
  line-height:1.5;
  margin-top:10px;
}

.progress{
  height:8px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
  margin-top:9px;
}

.bar{
  height:100%;
  width:0;
  background:#111;
  transition:width .2s;
}

.stats{
  display:flex;
  justify-content:space-between;
  color:#666;
  font-size:13px;
}

.list{
  max-height:330px;
  overflow:auto;
  border:1px solid #eee;
  border-radius:12px;
  margin-top:10px;
}

.item{
  display:flex;
  gap:7px;
  align-items:center;
  padding:8px;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.item input[type=checkbox]{
  width:20px;
  height:20px;
}

.item input[type=text]{
  padding:7px;
  border:1px solid #ddd;
  border-radius:8px;
  min-width:0;
}

.eng{
  width:34%;
}

.jp{
  flex:1;
}

.small{
  font-size:12px;
  color:#777;
  line-height:1.5;
}

.notice{
  padding:10px 12px;
  border-radius:12px;
  background:#f0f1f5;
  font-size:13px;
  line-height:1.5;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>📸 英単語カメラ暗記</h1>
<div class="sub">写真 → 自動読み取り → ランダム暗記</div>
</header>

<main>

<section class="section">

<h2>① 英単語表を写真から追加</h2>

<label class="fileBtn" for="photo">
📷 写真を撮る / 写真を選ぶ
</label>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="environment"
>

<div id="ocrStatus" class="status">
英単語表を撮影すると、自動で読み取ります。
</div>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div class="notice">
初回の読み取りだけ、OCR用データの読み込みに少し時間がかかります。
Wi-Fiなどインターネット接続をONにしてください。
</div>

</section>


<section class="section">

<h2>② 出題方向</h2>

<select id="mode">

<option value="jp">
日本語 → 英語
</option>

<option value="en">
英語 → 日本語
</option>

</select>

</section>


<section class="section">

<h2>③ 暗記する</h2>

<div class="stats">
<span id="count">0語</span>
<span id="weakCount">苦手 0語</span>
</div>

<div id="card" class="card">

<div class="label">
まだ単語がありません
</div>

<div class="prompt">
📷
</div>

<div class="hint">
写真を読み込んでください
</div>

</div>


<div class="row">

<button id="answerBtn" disabled>
タップして答えを見る
</button>

<button id="nextBtn" class="secondary" disabled>
次の問題 →
</button>

</div>


<div class="row" style="margin-top:8px">

<button id="weakBtn" class="secondary" disabled>
☆ 苦手にする
</button>

<button id="weakOnlyBtn" class="secondary" disabled>
苦手だけで学習
</button>

</div>

</section>


<section class="section">

<h2>読み取った単語</h2>

<div class="small">
OCRの間違いがあれば、ここで修正できます。
修正した内容は保存されます。
</div>

<div id="wordList" class="list"></div>

</section>


<section class="section">

<button
  id="clearBtn"
  class="secondary"
  style="width:100%"
>
単語データを全部消す
</button>

</section>

</main>


<script>

const $ = id => document.getElementById(id);

const KEY = "eitan_camera_words_v2";
const WKEY = "eitan_camera_weak_v2";

let words =
  JSON.parse(localStorage.getItem(KEY) || "[]");

let weak =
  new Set(
    JSON.parse(localStorage.getItem(WKEY) || "[]")
  );

let pool = [];
let current = null;
let revealed = false;
let weakOnly = false;


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(words)
  );

  localStorage.setItem(
    WKEY,
    JSON.stringify([...weak])
  );

}


function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


function updateStats(){

  $("count").textContent =
    words.length + "語";

  $("weakCount").textContent =
    "苦手 " +
    words.filter(
      w => weak.has(w.id)
    ).length +
    "語";

  const ok = words.length > 0;

  $("answerBtn").disabled = !ok;
  $("nextBtn").disabled = !ok;
  $("weakBtn").disabled = !ok;
  $("weakOnlyBtn").disabled = !ok;

}


function renderList(){

  if(!words.length){

    $("wordList").innerHTML =
      '<div style="padding:14px;color:#777">まだ単語がありません。</div>';

    return;
  }


  $("wordList").innerHTML =
    words.map(w => `

      <div class="item">

        <input
          type="checkbox"
          data-w="${esc(w.id)}"
          ${weak.has(w.id) ? "checked" : ""}
        >

        <input
          class="eng"
          type="text"
          value="${esc(w.eng)}"
          data-e="${esc(w.id)}"
        >

        <input
          class="jp"
          type="text"
          value="${esc(w.jp)}"
          data-j="${esc(w.id)}"
        >

      </div>

    `).join("");


  document
    .querySelectorAll("[data-w]")
    .forEach(el => {

      el.onchange = () => {

        el.checked
          ? weak.add(el.dataset.w)
          : weak.delete(el.dataset.w);

        save();
        updateStats();
        renderList();

      };

    });


  document
    .querySelectorAll("[data-e]")
    .forEach(el => {

      el.onchange = () => {

        const w =
          words.find(
            x => x.id === el.dataset.e
          );

        if(w){

          w.eng =
            el.value.trim();

          save();

        }

      };

    });


  document
    .querySelectorAll("[data-j]")
    .forEach(el => {

      el.onchange = () => {

        const w =
          words.find(
            x => x.id === el.dataset.j
          );

        if(w){

          w.jp =
            el.value.trim();

          save();

        }

      };

    });

}


function makePool(){

  const base =
    weakOnly
      ? words.filter(w => weak.has(w.id))
      : words.slice();

  pool =
    base.sort(
      () => Math.random() - 0.5
    );


  if(pool.length){

    nextCard();

  }else{

    current = null;

    $("card").innerHTML = `

      <div class="label">
        苦手単語がありません
      </div>

      <div class="prompt">
        🎉
      </div>

      <div class="hint">
        苦手チェックを付けてから使ってください
      </div>

    `;

  }

}


function nextCard(){

  if(!pool.length){

    const base =
      weakOnly
        ? words.filter(w => weak.has(w.id))
        : words.slice();

    pool =
      base.sort(
        () => Math.random() - 0.5
      );

  }

  if(!pool.length)return;

  current =
    pool.pop();

  revealed = false;

  showQuestion();

}


function showQuestion(){

  if(!current)return;

  const jp =
    $("mode").value === "jp";


  $("card").innerHTML = `

    <div class="label">
      ${jp ? "日本語 → 英語" : "英語 → 日本語"}
    </div>

    <div class="prompt">
      ${esc(
        jp
          ? current.jp
          : current.eng
      )}
    </div>

    <div class="hint">
      タップして答えを見る
    </div>

  `;


  $("answerBtn").textContent =
    "タップして答えを見る";


  $("weakBtn").textContent =
    weak.has(current.id)
      ? "★ 苦手を外す"
      : "☆ 苦手にする";

}


function speak(text){

  if(!("speechSynthesis" in window)){

    alert(
      "このiPhoneでは読み上げ機能を利用できません。"
    );

    return;

  }

  speechSynthesis.cancel();


  const u =
    new SpeechSynthesisUtterance(text);

  u.lang = "en-US";
  u.rate = 0.82;
  u.pitch = 1;

  speechSynthesis.speak(u);

}


function reveal(){

  if(!current)return;

  const jp =
    $("mode").value === "jp";

  revealed = true;


  if(jp){

    $("card").innerHTML = `

      <div class="label">
        ${esc(current.jp)}
      </div>

      <div class="answer">
        ${esc(current.eng)}
      </div>

      <div class="hint">
        🔊 英語を読み上げ中
      </div>

    `;

    speak(current.eng);

  }else{

    $("card").innerHTML = `

      <div class="label">
        ${esc(current.eng)}
      </div>

      <div class="answer jp">
        ${esc(current.jp)}
      </div>

      <div class="hint">
        🔊 英語を読み上げ中
      </div>

    `;

    speak(current.eng);

  }


  $("answerBtn").textContent =
    "🔊 もう一度読み上げる";

}


function doAnswer(){

  if(revealed){

    speak(
      current?.eng || ""
    );

  }else{

    reveal();

  }

}


$("answerBtn").onclick =
  doAnswer;


$("card").onclick =
  doAnswer;


$("nextBtn").onclick =
  nextCard;


$("mode").onchange =
  showQuestion;


$("weakBtn").onclick = () => {

  if(!current)return;


  weak.has(current.id)
    ? weak.delete(current.id)
    : weak.add(current.id);


  save();
  updateStats();
  renderList();


  $("weakBtn").textContent =
    weak.has(current.id)
      ? "★ 苦手を外す"
      : "☆ 苦手にする";

};


$("weakOnlyBtn").onclick = () => {

  weakOnly = !weakOnly;


  $("weakOnlyBtn").textContent =
    weakOnly
      ? "通常学習に戻す"
      : "苦手だけで学習";


  makePool();

};


$("clearBtn").onclick = () => {

  if(
    confirm(
      "単語と苦手チェックを全部消しますか？"
    )
  ){

    words = [];
    weak.clear();
    pool = [];
    current = null;

    save();
    updateStats();
    renderList();


    $("card").innerHTML = `

      <div class="label">
        まだ単語がありません
      </div>

      <div class="prompt">
        📷
      </div>

      <div class="hint">
        写真を読み込んでください
      </div>

    `;

  }

};


function centerY(b){

  return (b.y0 + b.y1) / 2;

}


function centerX(b){

  return (b.x0 + b.x1) / 2;

}


function isEnglish(t){

  return /^[A-Za-z][A-Za-z0-9 .,'’()\-\/]*$/.test(t)
    && /[A-Za-z]/.test(t);

}


function hasJapanese(t){

  return /[ぁ-んァ-ヶ一-龠]/.test(t);

}


function normalizeEnglish(t){

  return t
    .replace(
      /[^A-Za-z0-9 .,'’()\-\/]/g,
      ""
    )
    .replace(/\s+/g," ")
    .trim();

}


function buildPairs(wordsOCR){

  const items =
    wordsOCR.filter(
      w =>
        w.text &&
        w.confidence >= 25
    );


  items.sort(
    (a,b) =>
      centerY(a.bbox) -
      centerY(b.bbox)
  );


  const rows = [];


  for(const w of items){

    const y =
      centerY(w.bbox);


    let row =
      rows.find(
        r =>
          Math.abs(r.y-y) < 18
      );


    if(!row){

      row = {
        y,
        items:[]
      };

      rows.push(row);

    }


    row.items.push(w);


    row.y =
      row.items.reduce(
        (s,x) =>
          s + centerY(x.bbox),
        0
      ) / row.items.length;

  }


  const pairs = [];


  for(const row of rows){

    const ja =
      row.items.filter(
        w => hasJapanese(w.text)
      );


    const en =
      row.items.filter(
        w => isEnglish(w.text)
      );


    if(!ja.length || !en.length)
      continue;


    for(const e of en){

      const jp =
        ja
          .slice()
          .sort(
            (a,b) =>
              Math.abs(
                centerX(a.bbox) -
                centerX(e.bbox)
              )
              -
              Math.abs(
                centerX(b.bbox) -
                centerX(e.bbox)
              )
          )[0];


      const eng =
        normalizeEnglish(
          e.text
        );


      const jpt =
        jp.text.trim();


      if(
        eng.length >= 2 &&
        jpt.length >= 1
      ){

        const exists =
          pairs.find(
            p =>
              p.eng.toLowerCase() ===
                eng.toLowerCase()
              &&
              p.jp === jpt
          );


        if(!exists){

          pairs.push({
            eng,
            jp:jpt
          });

        }

      }

    }

  }


  return pairs;

}


async function runOCR(file){

  $("ocrStatus").textContent =
    "写真を読み込んでいます…";


  $("bar").style.width =
    "5%";


  const worker =
    await Tesseract.createWorker(
      "jpn+eng",
      1,
      {

        workerPath:
          "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",

        langPath:
          "https://tessdata.projectnaptha.com/4.0.0",

        corePath:
          "https://cdn.jsdelivr.net/npm/tesseract.js-core@5",

        logger:m => {

          if(m.status){

            const pct =
              m.progress
                ? Math.round(
                    m.progress * 100
                  )
                : 0;


            $("ocrStatus").textContent =
              "OCR: " +
              m.status +
              (
                pct
                  ? " " + pct + "%"
                  : ""
              );


            if(m.progress){

              $("bar").style.width =
                Math.max(
                  5,
                  m.progress * 100
                ) + "%";

            }

          }

        }

      }
    );


  const result =
    await worker.recognize(file);


  await worker.terminate();


  return result.data;

}


$("photo").onchange =
  async e => {

    const file =
      e.target.files[0];

    if(!file)return;


    $("ocrStatus").textContent =
      "OCRを開始します…";


    $("bar").style.width =
      "2%";


    try{

      const data =
        await runOCR(file);


      const pairs =
        buildPairs(
          data.words || []
        );


      $("bar").style.width =
        "100%";


      if(!pairs.length){

        $("ocrStatus").textContent =
          "文字は読み取れましたが、日本語と英語の組み合わせを見つけられませんでした。\n" +
          "表をできるだけ正面から、文字が大きく写るように撮ってもう一度試してください。";

        return;

      }


      const now =
        Date.now();


      const add =
        pairs.map(
          (p,i) => ({

            id:
              "w" +
              now +
              "_" +
              i +
              "_" +
              Math.random()
                .toString(16)
                .slice(2),

            eng:p.eng,

            jp:p.jp

          })
        );


      words =
        [...words,...add];


      save();
      updateStats();
      renderList();
      makePool();


      $("ocrStatus").textContent =
        "読み取り完了！ " +
        add.length +
        "語を追加しました。\n" +
        "間違いがあれば下の一覧で修正できます。";


    }catch(err){

      console.error(err);


      $("bar").style.width =
        "0";


      $("ocrStatus").textContent =
        "読み取りに失敗しました。\n" +
        "① iPhoneがインターネットに接続されているか確認\n" +
        "② Safariでこのページを開く\n" +
        "③ もう一度写真を撮る\n\n" +
        "初回はOCRデータの読み込みに1〜2分かかることがあります。";

    }finally{

      e.target.value = "";

    }

  };


updateStats();

renderList();


if(words.length){

  makePool();

}

</script>

</body>
</html>
