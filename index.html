<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LexiQ">
  <title>LexiQ</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #070b14;
      --panel: #101827;
      --panel2: #151f31;
      --text: #f5f8ff;
      --muted: #aab6ca;
      --blue: #20d9ff;
      --blue2: #3777ff;
      --danger: #ff6b8a;
      --line: rgba(255,255,255,.10);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(39,104,255,.22), transparent 35%),
        linear-gradient(180deg, #080d18 0%, #050810 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    button { font: inherit; }
    .wrap {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 14px 36px;
    }
    header {
      text-align: center;
      padding: 8px 0 18px;
    }
    .brand {
      font-size: clamp(38px, 10vw, 64px);
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #fff 45%, #23dfff 70%, #3977ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline { color: var(--muted); margin-top: 2px; font-size: 14px; }
    .panel {
      background: rgba(16,24,39,.88);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
      margin-bottom: 14px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 10px;
      cursor: pointer;
      transition: transform .08s, border-color .15s, background .15s;
    }
    .btn:active { transform: scale(.98); }
    .btn.active {
      border-color: rgba(32,217,255,.7);
      background: linear-gradient(135deg, rgba(32,217,255,.18), rgba(55,119,255,.15));
    }
    .btn.primary {
      background: linear-gradient(135deg, #159cc8, #315de8);
      border: none;
      font-weight: 700;
    }
    .study-card {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .counter { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .word {
      font-size: clamp(38px, 11vw, 70px);
      font-weight: 800;
      letter-spacing: .5px;
      line-height: 1.12;
      word-break: break-word;
    }
    .answer {
      margin-top: 24px;
      font-size: clamp(25px, 7vw, 42px);
      font-weight: 700;
      color: #dce8ff;
      min-height: 48px;
    }
    .hint {
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }
    .small { font-size: 13px; padding: 11px 8px; }
    .weak { color: #ffd4dd; }
    .weak.checked {
      background: rgba(255,107,138,.18);
      border-color: rgba(255,107,138,.65);
    }
    .status {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      min-height: 20px;
      margin-top: 8px;
    }
    .list {
      max-height: 340px;
      overflow: auto;
      margin-top: 10px;
    }
    .row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .num { color: var(--muted); }
    .en { font-weight: 700; }
    .jp { color: var(--muted); text-align: right; }
    .error {
      color: #ffd5dc;
      background: rgba(255,80,110,.12);
      border: 1px solid rgba(255,80,110,.25);
      padding: 12px;
      border-radius: 12px;
      line-height: 1.5;
      display: none;
    }
    .footer-note {
      text-align:center; color:#71809a; font-size:12px; margin-top:14px;
    }
    @media (max-width: 430px) {
      .study-card { min-height: 330px; }
      .actions { grid-template-columns: 1fr 1fr; }
      .actions .next { grid-column: span 2; }
    }
  </style>
</head>

<body>
<div class="wrap">
  <header>
    <div class="brand">LexiQ</div>
    <div class="tagline">つながる、覚える、得点になる。</div>
  </header>

  <div class="panel">
    <div class="controls">
      <button id="modeEn" class="btn active">英語 → 日本語</button>
      <button id="modeJp" class="btn">日本語 → 英語</button>
      <button id="allBtn" class="btn active">全部から出題</button>
      <button id="weakBtn" class="btn">苦手だけ</button>
    </div>
  </div>

  <div id="error" class="error"></div>

  <div class="panel">
    <div id="card" class="study-card">
      <div id="counter" class="counter">読み込み中…</div>
      <div id="word" class="word">LexiQ</div>
      <div id="answer" class="answer"></div>
      <div id="hint" class="hint">タップして答えを見る</div>
    </div>

    <div class="actions">
      <button id="speak" class="btn small">🔊 読み上げ</button>
      <button id="weak" class="btn small weak">☆ 苦手にする</button>
      <button id="next" class="btn primary next">次の問題 →</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="panel">
    <button id="listToggle" class="btn" style="width:100%">📚 単語一覧を表示</button>
    <div id="list" class="list" hidden></div>
  </div>

  <div class="footer-note">LexiQ · words.csv から単語を読み込みます</div>
</div>

<script>
const state = {
  words: [],
  pool: [],
  current: null,
  revealed: false,
  mode: "en",
  weakOnly: false
};

const $ = id => document.getElementById(id);

function showError(msg) {
  $("error").style.display = "block";
  $("error").textContent = msg;
}

function weakSet() {
  try {
    return new Set(JSON.parse(localStorage.getItem("lexiq_weak") || "[]").map(String));
  } catch {
    return new Set();
  }
}
function saveWeak(set) {
  localStorage.setItem("lexiq_weak", JSON.stringify([...set]));
}
function isWeak(w) {
  return weakSet().has(String(w.id));
}
function toggleWeak() {
  if (!state.current) return;
  const set = weakSet();
  const id = String(state.current.id);
  if (set.has(id)) set.delete(id);
  else set.add(id);
  saveWeak(set);
  updateWeakButton();
  $("status").textContent = set.has(id) ? "苦手に追加しました" : "苦手から外しました";
}
function updateWeakButton() {
  const b = $("weak");
  if (!state.current) return;
  if (isWeak(state.current)) {
    b.textContent = "★ 苦手を外す";
    b.classList.add("checked");
  } else {
    b.textContent = "☆ 苦手にする";
    b.classList.remove("checked");
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    } else {
      if (c === '"') quoted = true;
      else if (c === ',') { row.push(cell.trim()); cell = ""; }
      else if (c === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
      else if (c !== '\r') cell += c;
    }
  }
  row.push(cell.trim());
  if (row.some(x => x !== "")) rows.push(row);
  return rows;
}

async function loadCSV() {
  try {
    const res = await fetch("words.csv", { cache: "no-store" });
    if (!res.ok) throw new Error("words.csv が見つかりません");
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("words.csv に単語データがありません");

    state.words = rows.slice(1)
      .filter(r => r.length >= 3 && r[0] && r[1] && r[2])
      .map(r => ({ id:r[0], jp:r[1], en:r[2] }));

    if (!state.words.length) throw new Error("読み込める単語がありません");
    buildPool();
    renderList();
    nextQuestion();
  } catch (e) {
    showError("単語データを読み込めませんでした。GitHubに「words.csv」があり、index.html と同じ場所にあるか確認してください。");
    $("counter").textContent = "読み込みエラー";
  }
}

function buildPool() {
  const source = state.weakOnly ? state.words.filter(isWeak) : state.words;
  state.pool = [...source];
  if (!state.pool.length) {
    $("status").textContent = "苦手単語がありません。まず☆を押して登録してください。";
  }
}

function nextQuestion() {
  if (!state.pool.length) buildPool();
  if (!state.pool.length) return;

  let candidates = state.pool;
  if (state.current && candidates.length > 1) {
    candidates = candidates.filter(w => w.id !== state.current.id);
  }
  state.current = candidates[Math.floor(Math.random() * candidates.length)];
  state.revealed = false;

  $("word").textContent = state.mode === "en" ? state.current.en : state.current.jp;
  $("answer").textContent = "";
  $("hint").textContent = "タップして答えを見る";
  $("counter").textContent = `${state.pool.length}問中 · No.${state.current.id}`;
  $("status").textContent = "";
  updateWeakButton();
}

function reveal() {
  if (!state.current) return;
  if (!state.revealed) {
    $("answer").textContent = state.mode === "en" ? state.current.jp : state.current.en;
    $("hint").textContent = "もう一度タップで次の問題";
    state.revealed = true;
    speak();
  } else {
    nextQuestion();
  }
}

function speak() {
  if (!state.current) return;
  const text = state.current.en;
  if (!("speechSynthesis" in window)) {
    $("status").textContent = "このブラウザは読み上げに対応していません";
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.82;
  speechSynthesis.speak(u);
}

function setMode(mode) {
  state.mode = mode;
  $("modeEn").classList.toggle("active", mode === "en");
  $("modeJp").classList.toggle("active", mode === "jp");
  nextQuestion();
}

function setWeakOnly(on) {
  state.weakOnly = on;
  $("weakBtn").classList.toggle("active", on);
  $("allBtn").classList.toggle("active", !on);
  buildPool();
  nextQuestion();
}

function renderList() {
  $("list").innerHTML = state.words.map(w =>
    `<div class="row">
      <div class="num">${escapeHtml(w.id)}</div>
      <div class="en">${escapeHtml(w.en)}${isWeak(w) ? " ★" : ""}</div>
      <div class="jp">${escapeHtml(w.jp)}</div>
    </div>`
  ).join("");
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

$("card").addEventListener("click", reveal);
$("next").addEventListener("click", nextQuestion);
$("speak").addEventListener("click", speak);
$("weak").addEventListener("click", toggleWeak);
$("modeEn").addEventListener("click", () => setMode("en"));
$("modeJp").addEventListener("click", () => setMode("jp"));
$("allBtn").addEventListener("click", () => setWeakOnly(false));
$("weakBtn").addEventListener("click", () => setWeakOnly(true));
$("listToggle").addEventListener("click", () => {
  const hidden = $("list").hidden;
  $("list").hidden = !hidden;
  $("listToggle").textContent = hidden ? "📚 単語一覧を隠す" : "📚 単語一覧を表示";
});

loadCSV();
</script>
</body>
</html>
